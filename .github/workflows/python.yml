name: Python plugin

on:
  push:
    branches:
      - master
      - dev
      - feature/*
      - fix/*
  pull_request:
    branches:
      - master
      - dev
      - feature/*

jobs:
  legacy:
    name: plugin (windows-latest, 3.3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.3 from the official archive
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'python33.msi'
          $installDir = Join-Path $env:RUNNER_TEMP 'python33'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.3.5/python-3.3.5.amd64.msi' -OutFile $installer
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn TARGETDIR=`"$installDir`" ALLUSERS=0" -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) { throw "Python installer failed: $($process.ExitCode)" }
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify the legacy interpreter
        run: python -c "import sys; assert sys.version_info[:2] == (3, 3), sys.version; print(sys.version)"
      - name: Compile plugin
        run: python -W error::SyntaxWarning -m py_compile phpfmt.py diff_match_patch/python3/diff_match_patch.py
      - name: Test plugin behavior
        run: python -B -W error::SyntaxWarning -m unittest discover -s tests/python -v

  plugin:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.8', '3.14']
        exclude:
          - os: macos-latest
            python: '3.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile plugin with syntax warnings as errors
        run: python -W error::SyntaxWarning -m py_compile phpfmt.py diff_match_patch/python3/diff_match_patch.py
      - name: Test plugin behavior
        run: python -B -W error::SyntaxWarning -m unittest discover -s tests/python -v
